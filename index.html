<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Robot - A-Frame</title>

    <!-- A-Frame 1.8.0 -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

<a-scene
    background="color: #ffffff"
    renderer="antialias: true; colorManagement: true"
>

    <!-- ================================================= -->
    <!-- アセット -->
    <!-- ================================================= -->

    <a-assets>

        <!-- 金属 -->
        <a-mixin
            id="metal"
            material="
                color: #384452;
                metalness: 0.9;
                roughness: 0.25;
            ">
        </a-mixin>

        <!-- 白い装甲 -->
        <a-mixin
            id="whiteArmor"
            material="
                color: #dce3eb;
                metalness: 0.85;
                roughness: 0.2;
            ">
        </a-mixin>

        <!-- 黒い装甲 -->
        <a-mixin
            id="blackArmor"
            material="
                color: #151c25;
                metalness: 0.95;
                roughness: 0.18;
            ">
        </a-mixin>

        <!-- 青い発光 -->
        <a-mixin
            id="blueLight"
            material="
                color: #00bfff;
                emissive: #00bfff;
                emissiveIntensity: 4;
                metalness: 0.4;
                roughness: 0.15;
            ">
        </a-mixin>

    </a-assets>


    <!-- ================================================= -->
    <!-- ライト -->
    <!-- ================================================= -->

    <a-light
        type="ambient"
        color="#ffffff"
        intensity="1.8">
    </a-light>

    <a-light
        type="directional"
        position="-5 10 8"
        intensity="2.5">
    </a-light>

    <a-light
        type="point"
        position="0 5 2"
        color="#66ccff"
        intensity="1.5"
        distance="10">
    </a-light>


    <!-- ================================================= -->
    <!-- カメラ -->
    <!-- ================================================= -->

    <a-camera
        position="0 4 20"
        look-controls="enabled: true"
        wasd-controls="enabled: true">

        <a-cursor
            raycaster="objects: .clickable"
            color="#00bfff">
        </a-cursor>

    </a-camera>
    <a-cylinder position="0 -0.5 5" radius="3" height="1" color="dimgray" ></a-cylinder>
    <a-cylinder position="4 -0.5 5" radius="3" height="1" color="dimgray" ></a-cylinder>
    <a-cylinder position="-4 -0.5 5" radius="3" height="1" color="dimgray" ></a-cylinder>

<!-- HEAVY WHITE ROBOT -->
