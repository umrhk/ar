<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>​
</head>

<body>
    <a-scene embedded arjs="sourseType: webcam">
        <assets>
            <img id="brickTexture" src="kururin-kuru-kuru.gif">
        </assets>
        <a-marker preset="Hiro">
            
            <a-box position="0 0.5 0" color="red" height="0.1" width="0.1"></a-box>
            <a-box position="0.5 0.5 0" color="blue" height="0.1" width="0.1"></a-box>
            <a-box position="-0.5 0.5 0" color="green" height="0.1" width="0.1"></a-box>
        </a-marker>
        <a-marker preset="kanji">         
            <a-box position="0 0.5 0"  height="1" width="1" material="src: #brickTexture;"></a-box>
        </a-marker> 
        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
