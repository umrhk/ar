<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A-Frame Tetris</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #info {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 10;
            color: white;
            font-family: sans-serif;
            font-size: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
        }

        #gameover {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;

            color: white;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            font-family: sans-serif;
        }

        #gameover button,
        #pauseButton {
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            margin-top: 8px;
        }

        #pauseButton {
            margin-left: 8px;
            background: #ffd64f00;
            color: #222;
        }

        #pauseScreen {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 15;
            color: white;
            background: rgba(0,0,0,0.85);
            padding: 25px 35px;
            border-radius: 12px;
            text-align: center;
            font-family: sans-serif;
            font-size: 28px;
        }
    </style>
</head>

<body>

<div id="info">
    SCORE: <span id="score">0</span><br>
    HIGH SCORE: <span id="highScore">0</span><br>
    <button id="pauseButton" onclick="togglePause()">一時停止</button><br>
    ← → 移動　回転 SPACE　↓ 落下　↑ 一気に落下
</div>

<div id="pauseScreen">PAUSED</div>

<div id="gameover">
    <h1>GAME OVER</h1>
    <p>SCORE: <span id="finalScore">0</span></p>
    <p>HIGH SCORE: <span id="finalHighScore">0</span></p>
    <button onclick="location.reload()">もう一度</button>
</div>

<a-scene>

    <!-- 背景 -->
    <a-sky color="black"></a-sky>

    <!-- ゲーム画面 -->
    <a-entity id="board"></a-entity>

    <!-- 枠 -->
    <a-box
        position="-5 -3 -3"
        width="0.2"
        height="15"
        depth="0.2"
        color="white">
    </a-box>

    <a-box
        position="5 -3 -3"
        width="0.2"
        height="15"
        depth="0.2"
        color="white">
    </a-box>

    <a-box
        position="0 -10.3 -3"
        width="10"
        height="0.2"
        depth="0.2"
        color="white">
    </a-box>

    <!-- カメラ (AI)-->
    <a-camera
    position="0 0 14"
    rotation="0 0 0"
    look-controls="enabled: false"
    wasd-controls="enabled: false">
</a-camera>

</a-scene>


<script>

    // =========================
    // ゲーム設定(AI)
    // =========================

    const COLS = 10  ;
    const ROWS = 20;

    const CELL_SIZE = 1;

    let board = [];

    let currentPiece = null;

    let score = 0;
    let highScore = Number(localStorage.getItem("aFrameTetrisHighScore")) || 0;

    let gameOver = false;
    let paused = false;
    let dropTimer;

    // 保存されている最高スコアを表示
    document.getElementById("highScore").textContent = highScore;

    // 最高スコアを更新・保存
    function updateHighScore() {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("aFrameTetrisHighScore", highScore);
            document.getElementById("highScore").textContent = highScore;
        }
    }

    // 一時停止・再開
    function togglePause() {
        if (gameOver) return;

        paused = !paused;

        const pauseButton = document.getElementById("pauseButton");
        const pauseScreen = document.getElementById("pauseScreen");

        if (paused) {
            clearInterval(dropTimer);
            pauseButton.textContent = "再開";
            pauseScreen.style.display = "block";
        } else {
            pauseButton.textContent = "一時停止";
            pauseScreen.style.display = "none";
            dropTimer = setInterval(drop, 700);
        }
    }


    // =========================
    // テトリスのブロック
    // =========================

    const pieces = [

        {
            color: "cyan",
            shape: [
                [1,1,1,1]
            ]
        },

        {
            color: "yellow",
            shape: [
                [1,1],
                [1,1]
            ]
        },

        {
            color: "purple",
            shape: [
                [0,1,0],
                [1,1,1]
            ]
        },

        {
            color: "orange",
            shape: [
                [1,0,0],
                [1,1,1]
            ]
        },

        {
            color: "blue",
            shape: [
                [0,0,1],
                [1,1,1]
            ]
        },

        {
            color: "lime",
            shape: [
                [0,1,1],
                [1,1,0]
            ]
        },

        {
            color: "red",
            shape: [
                [1,1,0],
                [0,1,1]
            ]
        }

    ];


    // =========================
    // ボード作成
    // =========================

    function createBoard() {

        for (let y = 0; y < ROWS; y++) {

            board[y] = [];

            for (let x = 0; x < COLS; x++) {

                board[y][x] = null;

            }

        }

    }


    // =========================
    // ランダムなブロック
    // =========================

    function createPiece() {

        const data =
            pieces[Math.floor(Math.random() * pieces.length)];

        currentPiece = {

            shape: data.shape.map(row => [...row]),

            color: data.color,

            x: 3,

            y: 0

        };


        // 最初から置けない場合ゲームオーバー

        if (collision()) {

            endGame();

        }

    }


    // =========================
    // 衝突判定
    // =========================

    function collision() {

        for (let y = 0; y < currentPiece.shape.length; y++) {

            for (let x = 0; x < currentPiece.shape[y].length; x++) {

                if (!currentPiece.shape[y][x]) {
                    continue;
                }

                const boardX =
                    currentPiece.x + x;

                const boardY =
                    currentPiece.y + y;


                if (boardX < 0 ||
                    boardX >= COLS ||
                    boardY >= ROWS) {

                    return true;

                }


                if (boardY >= 0 &&
                    board[boardY][boardX]) {

                    return true;

                }

            }

        }

        return false;

    }


    // =========================
    // ブロック固定(AI)
    // =========================

    function merge() {

        for (let y = 0; y < currentPiece.shape.length; y++) {

            for (let x = 0; x < currentPiece.shape[y].length; x++) {

                if (!currentPiece.shape[y][x]) {
                    continue;
                }

                const boardX =
                    currentPiece.x + x;

                const boardY =
                    currentPiece.y + y;

                if (boardY >= 0) {

                    board[boardY][boardX] =
                        currentPiece.color;

                }

            }

        }

    }


    // =========================
    // ライン削除
    // =========================

    function clearLines() {

        let lines = 0;

        for (let y = ROWS - 1; y >= 0; y--) {

            let full = true;

            for (let x = 0; x < COLS; x++) {

                if (!board[y][x]) {

                    full = false;
                    break;

                }

            }


            if (full) {

                board.splice(y, 1);

                board.unshift(
                    new Array(COLS).fill(null)
                );

                lines++;

                y++;

            }

        }


        if (lines > 0) {

            score += lines * 100;

            document.getElementById("score").textContent = score;
            updateHighScore();
        }

    }


    // =========================
    // ブロックを下に落とす
    // =========================

    function drop() {

        if (gameOver || paused) return;

        currentPiece.y++;

        if (collision()) {

            currentPiece.y--;

            merge();

            clearLines();

            createPiece();

        }

        draw();

    }


    // =========================
    // 左右移動
    // =========================

    function move(dx) {

        if (gameOver || paused) return;

        currentPiece.x += dx;

        if (collision()) {

            currentPiece.x -= dx;

        }

        draw();

    }


    // =========================
    // 回転
    // =========================

    function rotate() {

        if (gameOver || paused) return;


        const oldShape =
            currentPiece.shape;


        const rows =
            oldShape.length;

        const cols =
            oldShape[0].length;


        const newShape = [];


        for (let x = 0; x < cols; x++) {

            newShape[x] = [];

            for (let y = rows - 1; y >= 0; y--) {

                newShape[x].push(
                    oldShape[y][x]
                );

            }

        }


        currentPiece.shape =
            newShape;


        if (collision()) {

            currentPiece.shape =
                oldShape;

        }


        draw();

    }


    // =========================
    // 一気に落とす
    // =========================

    function hardDrop() {

        if (gameOver || paused) return;

        while (!collision()) {

            currentPiece.y++;

        }

        currentPiece.y--;

        drop();

    }


    // =========================
    // A-Frameに描画
    // =========================

    function draw() {

        const boardElement =
            document.getElementById("board");


        // 一度全部削除(AI)

        while (boardElement.firstChild) {

            boardElement.removeChild(
                boardElement.firstChild
            );

        }


        // 固定ブロックを描画(AI)

        for (let y = 0; y < ROWS; y++) {

            for (let x = 0; x < COLS; x++) {

                if (board[y][x]) {

                    createBlock(
                        x,
                        y,
                        board[y][x]
                    );

                }

            }

        }


        // 落下中ブロックを描画(AI)

        if (currentPiece) {

            for (
                let y = 0;
                y < currentPiece.shape.length;
                y++
            ) {

                for (
                    let x = 0;
                    x < currentPiece.shape[y].length;
                    x++
                ) {

                    if (
                        currentPiece.shape[y][x]
                    ) {

                        createBlock(

                            currentPiece.x + x,

                            currentPiece.y + y,

                            currentPiece.color

                        );

                    }

                }

            }

        }

    }


    // =========================
    // ブロック生成(AI)
    // =========================

    function createBlock(x, y, color) {

        const block =
            document.createElement("a-box");


        // X座標
        const px =
            -4.5 + x;


        // Y座標
        const py =
            9.5 - y;


        block.setAttribute(
            "position",
            `${px} ${py} -3`
        );


        block.setAttribute(
            "width",
            "0.9"
        );


        block.setAttribute(
            "height",
            "0.9"
        );


        block.setAttribute(
            "depth",
            "0.9"
        );


        block.setAttribute(
            "color",
            color
        );


        block.setAttribute(
            "animation",
            "property: rotation; to: 0 360 0; loop: true; dur: 5000"
        );


        document.getElementById("board")
            .appendChild(block);

    }


    // =========================
    // ゲームオーバー
    // =========================

    function endGame() {

        gameOver = true;

        clearInterval(dropTimer);
        updateHighScore();

        document.getElementById("finalScore").textContent = score;
        document.getElementById("finalHighScore").textContent = highScore;
        document.getElementById("gameover").style.display = "block";
        document.getElementById("pauseButton").disabled = true;
        document.getElementById("pauseScreen").style.display = "none";

    }


    // =========================
    // キーボード操作
    // =========================

    document.addEventListener(
        "keydown",
        function(event) {

            if (gameOver || paused) {
                if (event.code === "Space") event.preventDefault();
                return;
            }

            if (event.key === "ArrowLeft") {

                move(-1);

            }

            else if (event.key === "ArrowRight") {

                move(1);

            }

            else if (event.key === "ArrowDown") {

                drop();

            }

            else if (event.key === "ArrowUp") {

                hardDrop();

            }

            else if (event.code === "Space") {

                event.preventDefault();

                rotate();

            }

        }
    );


    // =========================
    // ゲーム開始
    // =========================

    createBoard();

    createPiece();

    draw();


    // 0.7秒ごとに落下

    dropTimer = setInterval(
        drop,
        700
    );

</script>

</body>
</html>
