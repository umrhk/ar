<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <a-scene
    background="color: #020611"
    renderer="
        antialias: true;
        colorManagement: true;
    "
>

    <a-assets>

        <!-- 宇宙背景 -->
        <img
            id="space"
            src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg"
        >

    </a-assets>


    <!-- ===================================== -->
    <!-- LIGHT(AI) -->
    <!-- ===================================== -->

    <a-entity
        light="
            type: ambient;
            color: #6478a8;
            intensity: 1.2;
        ">
    </a-entity>

    <a-entity
        light="
            type: directional;
            color: #ffffff;
            intensity: 2;
        "
        position="-5 8 5">
    </a-entity>

    <a-entity
        light="
            type: point;
            color: #6633ff;
            intensity: 5;
            distance: 30;
        "
        position="0 4 3">
    </a-entity>


    <!-- ===================================== -->
    <!-- SPACE -->
    <!-- ===================================== -->

    <a-sky
        color="#020611">
    </a-sky>

    <!-- ===================================== -->
    <!-- ROBOT -->
    <!-- ===================================== -->

    <a-entity
        id="robot"
        position="0 0 0"
        rotation="0 180 0"
        scale="1.25 1.25 1.25">


        <!-- ================================= -->
        <!-- BACK MAIN UNIT -->
        <!-- ================================= -->

        <a-box
            position="0 2.1 0.7"
            width="0.9"
            height="1.8"
            depth="0.5"
            color="#27324a"
            material="
                metalness: 0.85;
                roughness: 0.2;
            "
            shadow="cast: true">
        </a-box>


        <!-- ================================= -->
        <!-- LEFT LARGE WING -->
        <!-- ================================= -->

        <a-entity
            position="-0.65 2.3 0.8"
            rotation="0 0 -15">

            <a-box
                position="0 0 0"
                width="0.55"
                height="3.3"
                depth="0.18"
                color="#283d79"
                material="
                    metalness: 0.7;
                    roughness: 0.18;
                "
                shadow="cast:true">
            </a-box>

            <a-box
                position="0 0 0.13"
                width="0.08"
                height="3"
                depth="0.04"
                color="#d82cff"
                material="
                    emissive:#c000ff;
                    emissiveIntensity:3;
                ">
            </a-box>

            <a-box
                position="0 1.6 0"
                width="0.65"
                height="0.15"
                depth="0.22"
                color="#9e3de0"
                material="
                    emissive:#7c20ff;
                    emissiveIntensity:2;
                ">
            </a-box>

        </a-entity>


        <!-- ================================= -->
        <!-- RIGHT LARGE WING -->
        <!-- ================================= -->

        <a-entity
            position="0.65 2.3 0.8"
            rotation="0 0 15">

            <a-box
                width="0.55"
                height="3.3"
                depth="0.18"
                color="#283d79"
                material="
                    metalness:0.7;
                    roughness:0.18;
                "
                shadow="cast:true">
            </a-box>

            <a-box
                position="0 0 0.13"
                width="0.08"
                height="3"
                depth="0.04"
                color="#d82cff"
                material="
                    emissive:#c000ff;
                    emissiveIntensity:3;
                ">
            </a-box>

            <a-box
                position="0 1.6 0"
                width="0.65"
                height="0.15"
                depth="0.22"
                color="#9e3de0"
                material="
                    emissive:#7c20ff;
                    emissiveIntensity:2;
                ">
            </a-box>

        </a-entity>


        <!-- ================================= -->
        <!-- HEAD -->
        <!-- ================================= -->

        <a-box
            position="0 3.05 0"
            width="0.5"
            height="0.5"
            depth="0.45"
            color="#dfe7ed"
            material="
                metalness:0.6;
                roughness:0.22;
            "
            shadow="cast:true">
        </a-box>


        <!-- 顔 -->
        <a-box
            position="0 3.0 -0.28"
            width="0.32"
            height="0.2"
            depth="0.07"
            color="#18202e">
        </a-box>


        <!-- センサー(AI) -->
        <a-box
            position="0 3.05 -0.33"
            width="0.13"
            height="0.09"
            depth="0.03"
            color="#ff3030"
            material="
                emissive:#ff0000;
                emissiveIntensity:5;
            ">
        </a-box>


        <!-- ================================= -->
        <!-- V ANTENNA -->
        <!-- ================================= -->

        <a-box
            position="-0.15 3.37 0"
            width="0.05"
            height="0.55"
            depth="0.05"
            rotation="0 0 -30"
            color="#e5b52b"
            material="
                emissive:#d28b00;
                emissiveIntensity:1;
            ">
        </a-box>

        <a-box
            position="0.15 3.37 0"
            width="0.05"
            height="0.55"
            depth="0.05"
            rotation="0 0 30"
            color="#e5b52b"
            material="
                emissive:#d28b00;
                emissiveIntensity:1;
            ">
        </a-box>


        <!-- ================================= -->
        <!-- CHEST -->
        <!-- ================================= -->

        <a-box
            position="0 2.15 -0.35"
            width="0.95"
            height="0.9"
            depth="0.3"
            color="#e8edf0"
            material="
                metalness:0.55;
                roughness:0.2;
            "
            shadow="cast:true">
        </a-box>

        <a-box
            position="-0.3 2.3 -0.52"
            width="0.35"
            height="0.4"
            depth="0.1"
            color="#345db5">
        </a-box>

        <a-box
            position="0.3 2.3 -0.52"
            width="0.35"
            height="0.4"
            depth="0.1"
            color="#345db5">
        </a-box>

        <a-box
            position="0 1.9 -0.53"
            width="0.25"
            height="0.3"
            depth="0.08"
            color="#c52f38">
        </a-box>


        <!-- ================================= -->
        <!-- SHOULDERS -->
        <!-- ================================= -->

        <a-box
            position="-0.75 2.4 0"
            width="0.7"
            height="0.65"
            depth="0.7"
            color="#dfe5ea"
            rotation="0 0 -10"
            shadow="cast:true">
        </a-box>

        <a-box
            position="0.75 2.4 0"
            width="0.7"
            height="0.65"
            depth="0.7"
            color="#dfe5ea"
            rotation="0 0 10"
            shadow="cast:true">
        </a-box>


        <!-- ================================= -->
        <!-- LEFT ARM -->
        <!-- ================================= -->

        <a-cylinder
            position="-0.82 1.75 0"
            radius="0.18"
            height="0.9"
            rotation="0 0 -10"
            color="#33405b"
            material="
                metalness:0.85;
                roughness:0.2;
            ">
        </a-cylinder>

        <a-box
            position="-0.95 1.25 -0.05"
            width="0.4"
            height="0.7"
            depth="0.42"
            color="#e2e7eb"
            shadow="cast:true">
        </a-box>


        <!-- ================================= -->
        <!-- RIGHT ARM -->
        <!-- ================================= -->

        <a-cylinder
            position="0.82 1.75 0"
            radius="0.18"
            height="0.9"
            rotation="0 0 10"
            color="#33405b"
            material="
                metalness:0.85;
                roughness:0.2;
            ">
        </a-cylinder>

        <a-box
            position="0.95 1.25 -0.05"
            width="0.4"
            height="0.7"
            depth="0.42"
            color="#e2e7eb"
            shadow="cast:true">
        </a-box>


        <!-- ================================= -->
        <!-- WAIST -->
        <!-- ================================= -->

        <a-box
            position="0 0.9 0"
            width="0.8"
            height="0.45"
            depth="0.6"
            color="#27324a"
            material="
                metalness:0.8;
                roughness:0.2;
            ">
        </a-box>


        <!-- ================================= -->
        <!-- LEFT LEG -->
        <!-- ================================= -->

        <a-box
            position="-0.37 0.3 0"
            width="0.5"
            height="1.0"
            depth="0.5"
            color="#dce3e8"
            shadow="cast:true">
        </a-box>

        <a-box
            position="-0.37 -0.45 -0.03"
            width="0.48"
            height="0.8"
            depth="0.48"
            color="#e9eef1"
            shadow="cast:true">
        </a-box>


        <!-- ================================= -->
        <!-- RIGHT LEG -->
        <!-- ================================= -->

        <a-box
            position="0.37 0.3 0"
            width="0.5"
            height="1.0"
            depth="0.5"
            color="#dce3e8"
            shadow="cast:true">
        </a-box>

        <a-box
            position="0.37 -0.45 -0.03"
            width="0.48"
            height="0.8"
            depth="0.48"
            color="#e9eef1"
            shadow="cast:true">
        </a-box>


        <!-- ================================= -->
        <!-- RED FEET -->
        <!-- ================================= -->

        <a-box
            position="-0.37 -0.95 -0.3"
            width="0.55"
            height="0.25"
            depth="0.75"
            color="#c8323d"
            shadow="cast:true">
        </a-box>

        <a-box
            position="0.37 -0.95 -0.3"
            width="0.55"
            height="0.25"
            depth="0.75"
            color="#c8323d"
            shadow="cast:true">
        </a-box>


        <!-- ================================= -->
        <!-- messala glanze -->
        <!-- ================================= -->

        <a-cylinder
            position="-0.85 2.8 0.8"
            radius="0.12"
            height="1.7"
            rotation="0 0 -18"
            color="#353c48"
            material="
                metalness:0.9;
                roughness:0.15;
            ">
        </a-cylinder>

        <a-cylinder
            position="0.85 2.8 0.8"
            radius="0.12"
            height="1.7"
            rotation="0 0 18"
            color="#353c48"
            material="
                metalness:0.9;
                roughness:0.15;
            ">
        </a-cylinder>


        <!-- ================================= -->
        <!-- LARGE RIFLE -->
        <!-- ================================= -->

        <a-entity
            position="-1.05 1.45 -0.5"
            rotation="0 0 -55">

            <!-- 銃本体 -->
            <a-box
                width="0.35"
                height="2"
                depth="0.38"
                color="#343a44"
                material="
                    metalness:0.95;
                    roughness:0.15;
                "
                shadow="cast:true">
            </a-box>

            <!-- 白い銃身 -->
            <a-cylinder
                position="0 1.3 0"
                radius="0.07"
                height="2.3"
                color="#dbe4e8"
                material="
                    metalness:0.85;
                    roughness:0.15;
                ">
            </a-cylinder>

            <!-- 青い発光ライン -->
            <a-box
                position="0 1.2 -0.2"
                width="0.05"
                height="2.2"
                depth="0.04"
                color="#61d8ff"
                material="
                    emissive:#00bfff;
                    emissiveIntensity:5;
                ">
            </a-box>

        </a-entity>


        <!-- ================================= -->
        <!-- RIGHT BEAM SABER -->
        <!-- ================================= -->

        <a-entity
            position="1.05 1.45 -0.6"
            rotation="0 0 -28">

            <!-- 柄 -->
            <a-cylinder
                radius="0.08"
                height="0.45"
                color="#20252c"
                material="
                    metalness:0.9;
                    roughness:0.15;
                ">
            </a-cylinder>

            <!-- ビーム -->
            <a-cylinder
                position="0 1.0 0"
                radius="0.12"
                height="1.8"
                color="#fff6b0"
                material="
                    emissive:#ffff00;
                    emissiveIntensity:7;
                    opacity:0.9;
                    transparent:true;
                ">
            </a-cylinder>

            <!-- 外側 -->
            <a-cylinder
                position="0 1.0 0"
                radius="0.19"
                height="1.8"
                color="#ffe900"
                material="
                    emissive:#ffcc00;
                    emissiveIntensity:3;
                    opacity:0.2;
                    transparent:true;
                ">
            </a-cylinder>

        </a-entity>


        <!-- ================================= -->
        <!-- LEFT BEAM SABER -->
        <!-- ================================= -->

        <a-entity
            position="-0.95 1.4 -0.6"
            rotation="0 0 35">

            <a-cylinder
                radius="0.08"
                height="0.45"
                color="#20252c">
            </a-cylinder>

            <a-cylinder
                position="0 1.0 0"
                radius="0.12"
                height="1.8"
                color="#fff6b0"
                material="
                    emissive:#ffff00;
                    emissiveIntensity:7;
                    opacity:0.9;
                    transparent:true;
                ">
            </a-cylinder>

            <a-cylinder
                position="0 1.0 0"
                radius="0.19"
                height="1.8"
                color="#ffe900"
                material="
                    emissive:#ffcc00;
                    emissiveIntensity:3;
                    opacity:0.2;
                    transparent:true;
                ">
            </a-cylinder>

        </a-entity>


        <!-- ================================= -->
        <!-- MAIN REACTOR(AI) -->
        <!-- ================================= -->

        <a-sphere
            position="0 2.05 -0.58"
            radius="0.12"
            color="#9effff"
            material="
                emissive:#00ffff;
                emissiveIntensity:6;
            ">
        </a-sphere>


        <!-- ================================= -->
        <!-- THRUSTERS(AI) -->
        <!-- ================================= -->

        <a-cylinder
            position="-0.55 0.1 0.65"
            radius="0.16"
            height="0.25"
            rotation="90 0 0"
            color="#171b22">
        </a-cylinder>

        <a-cylinder
            position="0.55 0.1 0.65"
            radius="0.16"
            height="0.25"
            rotation="90 0 0"
            color="#171b22">
        </a-cylinder>


        <!-- ================================= -->
        <!-- BLUE THRUSTER FLAMES(AI) -->
        <!-- ================================= -->

        <a-cone
            position="-0.55 0.1 1.0"
            radius-bottom="0.18"
            radius-top="0.02"
            height="1.4"
            color="#56d8ff"
            material="
                emissive:#00aaff;
                emissiveIntensity:8;
                opacity:0.75;
                transparent:true;
            "
            rotation="180 0 0">
        </a-cone>

        <a-cone
            position="0.55 0.1 1.0"
            radius-bottom="0.18"
            radius-top="0.02"
            height="1.4"
            color="#56d8ff"
            material="
                emissive:#00aaff;
                emissiveIntensity:8;
                opacity:0.75;
                transparent:true;
            "
            rotation="180 0 0">
        </a-cone>


    </a-entity>
    <!-- ===================================== -->
    <!-- CAMERA(1/3AI) -->
    <!-- ===================================== -->

    <a-entity
        position="0 3 11"
        rotation="-8 0 0">

        <a-camera
            look-controls="enabled: true">
        </a-camera>

    </a-entity>


    </a-scene>


    <script>
    const robot = document.querySelector("#robot");

    let t = 0;

    function animateRobot() {

        t += 0.025;

        const y = Math.sin(t) * 0.08;

        robot.object3D.position.y = y;

        requestAnimationFrame(animateRobot);
    }

    animateRobot();
    </script>

</body>
</html>
