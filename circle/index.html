<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>​

    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>​

    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>​
</head>
<body>
    <a-scene hands>
        <a-entity hand-anchor="index:4">
            <a-gltf-model id="circle" src="c_cyan.glb" animation-mixer="clip: MagicCircle_Loop" position="0 0 0" scale="2 2 2"></a-gltf-model>
        </a-entity>
        <a-entity hand-skeleton="points:true; lines:true; numbers:true; color:skyblue;"></a-entity>
    </a-scene>
</body>
</html>
