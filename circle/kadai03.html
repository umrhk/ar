
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Hand</title>

    <!-- 元のライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>

    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        #menu {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 95%;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: skyblue;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: blue;
        }

        
    </style>

</head>

<body>

    <!-- 操作ボタン -->
    <div id="menu">
        <button onclick="changeMagic(0)">青</button>
        <button onclick="changeMagic(1)">金</button>
        <button onclick="changeMagic(2)">ピンク</button>
        <button onclick="changeMagic(3)">紫</button>
        <button onclick="changeSize(0.1)">拡大</button>
        <button onclick="changeSize(-0.1)">縮小</button>
        <button onclick="toggleMagic()">表示切替</button>
        
    </div>

    <a-scene hands>

        <a-entity hand-anchor="index:8">

            <a-gltf-model
                id="circle"
                src="c_cyan.glb"
                animation-mixer="clip: MagicCircle_Loop"
                position="0 0 0"
                scale="0.5 0.5 0.5"
                rotation="90 0 0"
                magic-rotate>
            </a-gltf-model>

        </a-entity>

    </a-scene>

    <script>
        const magicFiles = [
            "c_cyan.glb",
            "c_gold.glb",
            "c_rose.glb",
            "c_violet.glb"
        ];

        let currentSize = 0.5;
        let visible = true;
        let rotating = true;

        const circle = document.querySelector("#circle");
       

        
        function changeMagic(index) {
            circle.setAttribute("src", magicFiles[index]);
        }

    
        function changeSize(value) {
            currentSize += value;

            currentSize = Math.max(0.1,
                Math.min(1.5, currentSize));

            circle.setAttribute("scale",
                `${currentSize} ${currentSize} ${currentSize}`);


        }//Aiを使用
        function toggleMagic() {
            visible = !visible;

            circle.setAttribute("visible", visible);
        }

    </script>

</body>
</html>
